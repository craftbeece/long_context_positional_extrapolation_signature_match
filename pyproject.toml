[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "craftbeece-long_context_positional_extrapolation_signature_match"
version = "0.1.0"
description = "通过字符级与结构级特征识别AI 芯片算子优化工程师·长上下文的位置编码外推的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "craftbeece" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://craftbeece.github.io"
Repository = "https://github.com/craftbeece/long_context_positional_extrapolation_signature_match"
Issues = "https://github.com/craftbeece/long_context_positional_extrapolation_signature_match/issues"

[project.scripts]
long_context_positional_extrapolation_signature_match = "long_context_positional_extrapolation_signature_match:main"

[tool.setuptools]
py-modules = ["long_context_positional_extrapolation_signature_match"]
